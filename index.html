<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你有101个优点</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(160deg, #fff5f5 0%, #fff0f3 30%, #ffe4e6 60%, #fce4ec 100%);
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }

  .main-title {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(2rem, 4.5vw, 4rem);
    font-weight: 700;
    color: #c9406b;
    z-index: 100;
    text-align: center;
    letter-spacing: 0.12em;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 1.2s ease, transform 1.2s ease;
  }

  .title-heart {
    display: inline-block;
    color: #e0527a;
  }

  .merit {
    position: absolute;
    font-size: clamp(0.75rem, 1.4vw, 1.15rem);
    font-weight: 600;
    color: #c9406b;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .merit.show {
    opacity: 0.85;
  }

  .merit.hide {
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .love-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(2.5rem, 7vw, 6rem);
    font-weight: 700;
    color: #d6336c;
    z-index: 200;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  .love-text.show {
    opacity: 1;
  }

  .counter {
    position: fixed;
    bottom: 28px;
    right: 36px;
    font-size: 1rem;
    color: #d0899e;
    z-index: 300;
    font-weight: 500;
    pointer-events: none;
    letter-spacing: 0.05em;
  }

  /* Petals */
  .petal {
    position: absolute;
    width: 16px;
    height: 16px;
    background: radial-gradient(circle, #ffccd5 0%, #f0a0b8 100%);
    border-radius: 50% 0 50% 50%;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    animation: petalFall linear forwards;
  }

  @keyframes petalFall {
    0%   { opacity: 0; transform: translate(0, -5vh) rotate(0deg) scale(0.3); }
    8%   { opacity: 0.6; transform: translate(6px, 0vh) rotate(30deg) scale(1); }
    100% { opacity: 0; transform: translate(20px, 110vh) rotate(540deg) scale(0.2); }
  }
</style>
</head>
<body>

<div class="main-title" id="mainTitle">
  你有<span class="title-heart">❤</span>101个优点
</div>

<div class="love-text" id="loveText">我爱你</div>

<div class="counter" id="counter">0 / 101</div>

<script>
(function() {
  const merits = [
    '温柔', '善良', '聪明', '可爱', '体贴', '勇敢', '坚强', '乐观', '真诚', '大方',
    '细心', '耐心', '幽默', '风趣', '深情', '专一', '可靠', '踏实', '勤奋', '努力',
    '美丽', '漂亮', '迷人', '优雅', '端庄', '知性', '气质', '魅力', '暖心', '阳光',
    '开朗', '活泼', '灵动', '率真', '坦率', '正直', '忠诚', '执着', '坚韧', '包容',
    '大度', '慷慨', '热心', '无私', '善解人意', '通情达理', '冰雪聪明', '心灵手巧',
    '才华横溢', '多才多艺', '知书达理', '蕙质兰心', '温婉可人', '甜美可人', '楚楚动人',
    '明眸皓齿', '笑靥如花', '国色天香', '倾国倾城', '沉鱼落雁', '闭月羞花', '天生丽质',
    '眉清目秀', '亭亭玉立', '风姿绰约', '仪态万方', '温文尔雅', '落落大方', '秀外慧中',
    '心思细腻', '观察入微', '随机应变', '处变不惊', '从容不迫',
    '泰然自若', '胸有成竹', '运筹帷幄', '高瞻远瞩', '深谋远虑', '独具慧眼', '别出心裁',
    '奇思妙想', '创意无限', '天马行空', '不拘一格', '独树一帜', '超凡脱俗', '与众不同',
    '独一无二', '无可替代', '完美无瑕', '光芒万丈', '璀璨夺目', '熠熠生辉', '光彩照人',
    '温暖如春', '柔情似水', '热情如火', '纯洁如雪', '清新如风', '灵动如溪'
  ];

  var total = merits.length; // 101
  var container = document.body;
  var mainTitle = document.getElementById('mainTitle');
  var loveText = document.getElementById('loveText');
  var counter = document.getElementById('counter');

  var meritEls = [];
  var occupiedAreas = [];

  function overlaps(rect, areas, padding) {
    padding = padding || 22;
    for (var i = 0; i < areas.length; i++) {
      var a = areas[i];
      if (!(rect.x + rect.w + padding < a.x || a.x + a.w + padding < rect.x ||
            rect.y + rect.h + padding < a.y || a.y + a.h + padding < rect.y)) {
        return true;
      }
    }
    return false;
  }

  function getPosition(elWidth, elHeight) {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var cx = vw / 2;
    var cy = vh / 2;
    var safeRX = Math.max(160, vw * 0.15);
    var safeRY = Math.max(80, vh * 0.08);
    var margin = 30;

    for (var attempt = 0; attempt < 200; attempt++) {
      var x = margin + Math.random() * (vw - elWidth - margin * 2);
      var y = margin + Math.random() * (vh - elHeight - margin * 2);
      var mx = x + elWidth / 2;
      var my = y + elHeight / 2;
      var dx = (mx - cx) / safeRX;
      var dy = (my - cy) / safeRY;
      if (dx * dx + dy * dy < 1.2) continue;
      var rect = { x: x, y: y, w: elWidth, h: elHeight };
      if (!overlaps(rect, occupiedAreas, 14)) {
        return { x: x, y: y };
      }
    }

    var x, y;
    do {
      x = margin + Math.random() * (vw - elWidth - margin * 2);
      y = margin + Math.random() * (vh - elHeight - margin * 2);
      var mx2 = x + elWidth / 2;
      var my2 = y + elHeight / 2;
      var dx2 = (mx2 - cx) / safeRX;
      var dy2 = (my2 - cy) / safeRY;
      if (dx2 * dx2 + dy2 * dy2 >= 0.8) break;
    } while (true);
    return { x: x, y: y };
  }

  function startAnimation() {
    var delayBetween = 130;
    var initialDelay = 700;

    for (var i = 0; i < total; i++) {
      setTimeout((function(index) {
        return function() { showMerit(index); };
      })(i), initialDelay + i * delayBetween);
    }

    // After all shown, wait 4 seconds, then transition
    var allShown = initialDelay + total * delayBetween;
    var pause = 4000;
    setTimeout(transitionToLove, allShown + pause);
  }

  function showMerit(index) {
    var el = document.createElement('div');
    el.className = 'merit';
    el.textContent = merits[index];

    container.appendChild(el);
    var rect = el.getBoundingClientRect();
    var w = rect.width;
    var h = rect.height;
    container.removeChild(el);

    var pos = getPosition(w, h);
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';

    var colors = [
      '#c9406b', '#d0557a', '#d4688a', '#b8355c', '#9e3a55',
      '#cc6b85', '#c25a75', '#ba4e6a', '#d47890', '#bf5070'
    ];
    el.style.color = colors[Math.floor(Math.random() * colors.length)];

    container.appendChild(el);

    // Record position
    var finalRect = el.getBoundingClientRect();
    occupiedAreas.push({
      x: finalRect.left,
      y: finalRect.top,
      w: finalRect.width,
      h: finalRect.height
    });

    meritEls.push(el);

    // Fade in
    requestAnimationFrame(function() {
      el.classList.add('show');
    });

    // Update counter
    counter.textContent = (index + 1) + ' / ' + total;
  }

  function transitionToLove() {
    // Fade out all merits
    for (var i = 0; i < meritEls.length; i++) {
      (function(el, idx) {
        setTimeout(function() {
          el.classList.add('hide');
        }, idx * 12);
      })(meritEls[i], i);
    }

    // Remove merits after fade
    setTimeout(function() {
      for (var i = 0; i < meritEls.length; i++) {
        if (meritEls[i].parentNode) meritEls[i].parentNode.removeChild(meritEls[i]);
      }
      meritEls = [];
    }, 900);

    // Fade out title
    setTimeout(function() {
      mainTitle.style.opacity = '0';
      mainTitle.style.transform = 'translate(-50%, -50%) scale(0.9)';
    }, 600);

    // Hide title & counter, show love
    setTimeout(function() {
      mainTitle.style.display = 'none';
      counter.style.display = 'none';
      loveText.classList.add('show');
    }, 1800);
  }

  // ---- Petals ----
  function createPetal() {
    var petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.left = (Math.random() * 96) + '%';
    petal.style.top = -(Math.random() * 15 + 5) + 'px';
    var dur = Math.random() * 8 + 10;
    petal.style.animationDuration = dur + 's';
    petal.style.animationDelay = Math.random() * 4 + 's';
    var size = Math.random() * 12 + 8;
    petal.style.width = size + 'px';
    petal.style.height = size + 'px';
    var colors = ['#ffccd5', '#ffdde4', '#ffc0cb', '#ffe4e1', '#f8c8d0', '#f5b8c5'];
    petal.style.background = 'radial-gradient(circle, ' + colors[Math.floor(Math.random()*colors.length)] + ' 0%, #e898b0 100%)';
    container.appendChild(petal);
    petal.addEventListener('animationend', function() {
      if (petal.parentNode) petal.parentNode.removeChild(petal);
    });
  }

  // Steady light petal rain
  setInterval(function() {
    if (document.querySelectorAll('.petal').length < 10) {
      createPetal();
    }
  }, 1200);

  // A few initial petals
  for (var p = 0; p < 5; p++) {
    setTimeout(function() { createPetal(); }, p * 500);
  }

  window.addEventListener('load', function() {
    setTimeout(startAnimation, 500);
  });

})();
</script>
</body>
</html>
